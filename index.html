<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Googol</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #fafafa 50%, #f0f7ff 100%);
            padding: 20px;
            gap: 32px;
        }

        .logo-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            animation: fadeDown 0.5s ease both;
        }

        h1 {
            font-size: clamp(48px, 11vw, 80px);
            font-weight: 800;
            letter-spacing: -2px;
            background: linear-gradient(90deg, #4285F4 0%, #34A853 33%, #FBBC05 66%, #EA4335 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            line-height: 1;
        }

        .tagline {
            font-size: 14px;
            color: #888;
            letter-spacing: 0.5px;
        }

        form {
            width: 100%;
            max-width: 620px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            animation: fadeUp 0.5s ease 0.1s both;
        }

        .search-bar {
            width: 100%;
            display: flex;
            align-items: center;
            background: #fff;
            border: 1.5px solid #e0e0e0;
            border-radius: 40px;
            padding: 4px 4px 4px 22px;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(66, 133, 244, 0.06);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-bar:focus-within {
            border-color: #4285F4;
            box-shadow: 0 4px 20px rgba(66, 133, 244, 0.18);
        }

        .search-icon {
            flex-shrink: 0;
            color: #aaa;
            transition: color 0.2s;
        }

        .search-bar:focus-within .search-icon {
            color: #4285F4;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 0;
            font-size: 16px;
            border: none;
            outline: none;
            background: transparent;
            color: #202124;
            caret-color: #4285F4;
        }

        input[type="text"]::placeholder {
            color: #bbb;
        }

        button {
            flex-shrink: 0;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 34px;
            background: linear-gradient(135deg, #4285F4 0%, #3367D6 100%);
            color: white;
            cursor: pointer;
            white-space: nowrap;
            letter-spacing: 0.3px;
            transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
            box-shadow: 0 2px 8px rgba(66, 133, 244, 0.35);
        }

        button:hover {
            background: linear-gradient(135deg, #3b78e7 0%, #2a5bc4 100%);
            box-shadow: 0 4px 16px rgba(66, 133, 244, 0.45);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
            box-shadow: 0 1px 4px rgba(66, 133, 244, 0.3);
        }

        .footer {
            font-size: 12px;
            color: #bbb;
            animation: fadeUp 0.5s ease 0.2s both;
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .search-bar {
                flex-direction: column;
                padding: 12px 16px;
                border-radius: 20px;
                align-items: stretch;
                gap: 10px;
            }

            .search-icon { display: none; }

            input[type="text"] {
                padding: 8px 0;
            }

            button {
                width: 100%;
                padding: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="logo-wrap">
        <h1>Googol</h1>
        <span class="tagline">Search the web, your way</span>
    </div>

    <form action="https://www.google.com/search" method="GET">
        <div class="search-bar">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" name="q" placeholder="Search anything on Googol" required>
            <button type="submit">Search</button>
        </div>
    </form>

    <p class="footer">Powered by Google Search</p>

</body>
</html>
