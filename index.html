<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Googol</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 20px;
            gap: 32px;
            position: relative;
            overflow: hidden;
            background: #0a0e27;
        }

        /* ── Animated background ── */
        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: radial-gradient(ellipse at 20% 50%, #1a1060 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 20%, #0d2a5e 0%, transparent 55%),
                        radial-gradient(ellipse at 60% 80%, #1a0d3d 0%, transparent 55%),
                        #07091e;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.55;
            animation: drift linear infinite;
        }

        .orb-1 {
            width: 520px; height: 520px;
            background: radial-gradient(circle, #4285F4 0%, transparent 70%);
            top: -160px; left: -120px;
            animation-duration: 18s;
            animation-name: drift1;
        }
        .orb-2 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, #34A853 0%, transparent 70%);
            bottom: -100px; right: -80px;
            animation-duration: 22s;
            animation-name: drift2;
        }
        .orb-3 {
            width: 300px; height: 300px;
            background: radial-gradient(circle, #EA4335 0%, transparent 70%);
            top: 55%; left: 60%;
            animation-duration: 26s;
            animation-name: drift3;
            opacity: 0.35;
        }
        .orb-4 {
            width: 260px; height: 260px;
            background: radial-gradient(circle, #FBBC05 0%, transparent 70%);
            top: 20%; right: 15%;
            animation-duration: 20s;
            animation-name: drift4;
            opacity: 0.3;
        }

        @keyframes drift1 {
            0%   { transform: translate(0,    0)    scale(1);    }
            33%  { transform: translate(60px, 80px) scale(1.08); }
            66%  { transform: translate(-40px,50px) scale(0.95); }
            100% { transform: translate(0,    0)    scale(1);    }
        }
        @keyframes drift2 {
            0%   { transform: translate(0,    0)     scale(1);    }
            33%  { transform: translate(-70px,-60px) scale(1.1);  }
            66%  { transform: translate(50px, -30px) scale(0.92); }
            100% { transform: translate(0,    0)     scale(1);    }
        }
        @keyframes drift3 {
            0%   { transform: translate(0,   0)    scale(1);    }
            50%  { transform: translate(-80px,60px) scale(1.15); }
            100% { transform: translate(0,   0)    scale(1);    }
        }
        @keyframes drift4 {
            0%   { transform: translate(0,    0)     scale(1);   }
            40%  { transform: translate(50px, -70px) scale(1.1); }
            80%  { transform: translate(-30px, 40px) scale(0.9); }
            100% { transform: translate(0,    0)     scale(1);   }
        }

        /* Stars */
        .stars {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(1px 1px at 10%  15%, rgba(255,255,255,0.7) 0%, transparent 100%),
                radial-gradient(1px 1px at 25%  40%, rgba(255,255,255,0.5) 0%, transparent 100%),
                radial-gradient(1px 1px at 40%  8%,  rgba(255,255,255,0.6) 0%, transparent 100%),
                radial-gradient(1px 1px at 55%  70%, rgba(255,255,255,0.4) 0%, transparent 100%),
                radial-gradient(1px 1px at 70%  30%, rgba(255,255,255,0.7) 0%, transparent 100%),
                radial-gradient(1px 1px at 85%  55%, rgba(255,255,255,0.5) 0%, transparent 100%),
                radial-gradient(1px 1px at 92%  12%, rgba(255,255,255,0.6) 0%, transparent 100%),
                radial-gradient(1px 1px at 5%   85%, rgba(255,255,255,0.4) 0%, transparent 100%),
                radial-gradient(1px 1px at 48%  92%, rgba(255,255,255,0.5) 0%, transparent 100%),
                radial-gradient(1.5px 1.5px at 78% 82%, rgba(255,255,255,0.6) 0%, transparent 100%),
                radial-gradient(1px 1px at 33%  60%, rgba(255,255,255,0.3) 0%, transparent 100%),
                radial-gradient(1px 1px at 62%  48%, rgba(255,255,255,0.4) 0%, transparent 100%);
        }

        /* Grid overlay */
        .grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        /* ── Content ── */
        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
            width: 100%;
        }

        .logo-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            animation: fadeDown 0.6s ease both;
        }

        h1 {
            font-size: clamp(52px, 12vw, 88px);
            font-weight: 800;
            letter-spacing: -2px;
            background: linear-gradient(90deg, #4285F4 0%, #34A853 33%, #FBBC05 66%, #EA4335 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            line-height: 1;
            filter: drop-shadow(0 0 30px rgba(66,133,244,0.4));
        }

        .tagline {
            font-size: 14px;
            color: rgba(255,255,255,0.45);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        form {
            width: 100%;
            max-width: 640px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            animation: fadeUp 0.6s ease 0.15s both;
        }

        .search-bar {
            width: 100%;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.07);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 40px;
            padding: 5px 5px 5px 22px;
            gap: 10px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 4px 24px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
            transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
        }

        .search-bar:focus-within {
            border-color: rgba(66, 133, 244, 0.7);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 4px rgba(66,133,244,0.15), 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.15);
        }

        .search-icon {
            flex-shrink: 0;
            color: rgba(255,255,255,0.35);
            transition: color 0.2s;
        }

        .search-bar:focus-within .search-icon {
            color: #4285F4;
        }

        input[type="text"] {
            flex: 1;
            padding: 13px 0;
            font-size: 16px;
            border: none;
            outline: none;
            background: transparent;
            color: rgba(255,255,255,0.9);
            caret-color: #4285F4;
        }

        input[type="text"]::placeholder {
            color: rgba(255,255,255,0.3);
        }

        button {
            flex-shrink: 0;
            padding: 12px 26px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 34px;
            background: linear-gradient(135deg, #4285F4 0%, #3367D6 100%);
            color: white;
            cursor: pointer;
            white-space: nowrap;
            letter-spacing: 0.3px;
            transition: transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 2px 12px rgba(66, 133, 244, 0.5);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(66, 133, 244, 0.6);
        }

        button:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(66, 133, 244, 0.4);
        }

        .footer {
            font-size: 12px;
            color: rgba(255,255,255,0.25);
            letter-spacing: 0.5px;
            animation: fadeUp 0.6s ease 0.25s both;
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .search-bar {
                flex-direction: column;
                padding: 14px 18px;
                border-radius: 22px;
                align-items: stretch;
                gap: 10px;
            }
            .search-icon { display: none; }
            input[type="text"] { padding: 6px 0; }
            button { width: 100%; padding: 13px; }
        }
    </style>
</head>

<body>

    <div class="bg">
        <div class="stars"></div>
        <div class="grid"></div>
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="orb orb-4"></div>
    </div>

    <div class="content">
        <div class="logo-wrap">
            <h1>Googol</h1>
            <span class="tagline">Search the web, your way</span>
        </div>

        <form action="https://www.google.com/search" method="GET">
            <div class="search-bar">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="7"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" name="q" placeholder="Search anything on Googol" required>
                <button type="submit">Search</button>
            </div>
        </form>

        <p class="footer">Powered by Google Search</p>
    </div>

</body>
</html>
